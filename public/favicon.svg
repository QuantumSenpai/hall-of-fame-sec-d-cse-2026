<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe29a" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b20" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d1a" />
      <stop offset="100%" stop-color="#0a0908" />
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners and gold border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />

  <!-- Guiding Light (4-point Star) -->
  <path d="M32 10 L33.8 15.2 L39 17 L33.8 18.8 L32 24 L30.2 18.8 L25 17 L30.2 15.2 Z" fill="url(#goldLight)" />

  <!-- Open Memory Book -->
  <!-- Left Page -->
  <path d="M14 45.5 C21 43.5, 26.5 45.5, 31.5 48.5 L31.5 24 C26.5 21, 21 19, 14 21 Z" fill="url(#gold)" />
  <!-- Right Page -->
  <path d="M50 45.5 C43 43.5, 37.5 45.5, 32.5 48.5 L32.5 24 C37.5 21, 43 19, 50 21 Z" fill="url(#gold)" />

  <!-- Spine / Center Divider -->
  <path d="M32 24 L32 48.5" stroke="#0a0908" stroke-width="1.8" stroke-linecap="round" />

  <!-- Internal page accents -->
  <path d="M18 27 C22 26, 25 27, 28 29" stroke="#0a0908" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <path d="M18 33 C22 32, 25 33, 28 35" stroke="#0a0908" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <path d="M46 27 C42 26, 39 27, 36 29" stroke="#0a0908" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <path d="M46 33 C42 32, 39 33, 36 35" stroke="#0a0908" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
</svg>
